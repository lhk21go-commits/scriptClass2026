<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 Method</title>
</head>
<body>
    <script>
        // 자바스크립트의 Array(배열)의 각종 Method
        let ranking=['Jason','Alice','Candy','Chris','Tom'];
        let arrTotal=['korea',90,'2026-09-28'];

        //1.pop() : 맨 마지막 요소 삭제하고 반환한다.
        console.log(`pop()하기 전 ranking 요소 : ${ranking}`);
        let popped = ranking.pop();
        console.log(`pop()한 요소 : ${popped}`);
        console.log(`pop()한 후 ranking 요소 : ${ranking}`);

        //2. push(new data) : 맨 마지막에 새로운 데이터 추가
        ranking.push('David');
        console.log(`push()한 후 ranking 요소 : ${ranking}`);

        //3. shift() : 맨 앞의 요소 삭제하고 반환한다.
        console.log(`shift()하기 전 ranking 요소 : ${ranking}`);
        let shifted = ranking.shift();
        console.log(`shift()한 ranking 요소 : ${shifted}`);
        console.log(`shift()한 후 ranking 요소 : ${ranking}`);
        
        //4. unshift() : 맨 앞에 새로운 데이터 추가
        ranking.unshift('Emma');
        console.log(`unshift()한 후 ranking 요소 : ${ranking}`);

        // 새로운 테스트를 위해 재할당한다.
        ranking=['Jason','Alice','Candy','Chris','Tom'];
        let number = [5,1,8,3,10];
        //5. join(연결한 문자) : 요소와 요소사이를 연갈한 문자로 연결하여
        //    문자열로 반환한다.
        let joinString = ranking.join('-');
        console.log(`join('-')한 후 ranking 요소 : ${joinString}`);

        //6. reverse() : 배열의 요소를 반대로 
        ranking.reverse();
        console.log(`reverse()한 후 ranking 요소 : ${ranking}`);
        arrTotal.reverse();
        console.log(`reverse()한 후 ranking 요소 : ${arrTotal}`);
        
        //7. sort() : 기본 오름차순 정렬
        ranking.sort();
        console.log(`sort()한 후 ranking 요소 : ${ranking}`);
        arrTotal.sort();
        console.log(`sort()한 후 ranking 요소 : ${arrTotal}`);
        
        //8. 내림차순 : sort((a,b) => (b-a))
        // 숫자는 정상적으로 적용되나, 문자는 오류 발생
        ranking.sort((a,b) => (b-a));
        console.log(`ranking한 요소를 sort((a,b) => (b-a))한 후 : ${ranking}`);
        number.sort((a,b) => (b-a));
        console.log(`ranking한 요소를 sort((a,b) => (b-a))한 후 : ${number}`);

        //9. slice(시작 인덱스번호, 끝 인덱스번호) : 
        //  지정한 시작 인덱스번호 ~ 끝 인덱스번호까지의 구간을 잘라서 
        //  새 배열로 생성한다.
        //  slice(1, 3) : 인덱스 1부터 ~ 인덱스 2까지만 정의된다.
        let sliced = ranking.slice(1,3);
        console.log(`ranking.slice(1,3)한 후 : ${sliced}`);
        console.log(`ranking.slice(1,3)한 후 : ${ranking}`);

        //10. splice(시작인, 삭제할 개수, 아이템) : splice 후 특정 위히에 데이터 추가
        // 시작인:2, 삭제할 개수:1, 아이템:p => 2위치에서 1개 삭제하고 p를 추가
        let spliced = ranking.splice(2,1,'Peter');
        console.log(`ranking.spllice(2,1,'Peter')한 후 ${spliced}`)
        console.log(`ranking.spllice(2,1,'Peter')한 후 ${ranking}`)

        //11. concat() : 두 배열을 합쳐 하나의 새 배열로 반환한다.
        let newRanking = ranking.concat('Sam', 'John');
        console.log(`ranking.concate() : ${newRanking}`)
        console.log(`ranking.concate()한 후  : ${ranking}`)

        //12. indexOf() : 특정 요소의 인덱스 위치를 반환. 단, 없으면 -1 반환
        ranking=['Jason','Alice','Candy','Chris','Tom'];
        let index = ranking.indexOf('Alice');
        let index02 = ranking.indexOf('Tomcare');
        console.log(`Alice의 인덱스 번호 : ${index}`)
        console.log(`TomCare의 인덱스 번호 : ${index02}`)

        //13. includes() : 특정 값이 존재하면 true, 존재하지 않으면 false
        let isTom = ranking.includes('Tom');
        let isJake = ranking.includes('Jake');
        console.log(`isTom 존재유무 : ${isTom}`);
        console.log(`isJake 존재유무 : ${isJake}`);

        //14. split('구분자') : 나열된 하나의 문자열을 지정한 구분자를 기분으로
        //                      쪼개서 배열로 생성하는 메소드
        let test = '사과, 포도, 딸기';
        let result14 = test.split(',');
        console.log(`test 결과 : ${result14}`);

    </script>
</body>
</html>
