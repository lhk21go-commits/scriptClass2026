<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2차원 배열</title>
</head>
<body>

    <script>
        //2차원 배열을 생성하는 방법 3가지
        //자바스크립트에서 2차원 배열은 기본적으로 존재하지 않는다.
        //다만, 2차원 배열처럼 생성할 수 있는 여러가지 방법이 존재한다.
        //1. 초기값을 할당하여 배열을 생성하는 방법
        // arr배열은 3행 2열의 배열을 선언과 동시에 초기화
        let arr = [
            ['a','b'],
            ['c','d'],
            ['e','f']
        ];
        //for문을 이용하여 콘솔에 출력
        //단, 다중 for문을 사용
        for(let i=0; i<arr.length; i++){    //행
            for(let j=0; j<arr[i].length; j++){   //열
                console.log(`arr의 출력 : ${arr[i][j]}`);
            }
        }

        //2. new Array을 이용
        let arr02 = new Array(2);   //행
        //열은 for문을 이용
        for(let i=0; i<arr02.length; i++){
            arr02[i] = new Array(3);    //열
            for(let j=0; j<arr02[i].length; j++){
                arr02[i][j]=5;
            }
        }
        
        //출력
        arr03.forEach((value, index, arr) => {
            console.log(`arr03 출력 : ${arr}`);
        });
        for(let i=0; i<arr02.length; i++){
            for(let j=0; j<arr02[i].length; j++)
            console.log(`$[i], $[j]`);
        }
        
        //ES6(자바스크립트 6버전 의미)을 지원하는 모든 브라우저라면 사용 가능
        //Array.from(Array(2), () => new Array(3));
        const arr03 = Array.from(Array(6), () => new Array(7)).fill(0);
        console.log(`arr03출력 : ${arr03}`);
        //출력
        for(let i=0; i<arr03.length; i++){
            for(let j=0; j<arr03[i].length; j++)
            console.log(`$[i], $[j]`);
        }

        //forEach : 배열 순회 전용 메소드로, 배열일 때만 사용가능
        //forEach(value,index,arr) => value:값, index:인덱스 번호, arr:배열
                                      // => 순서가 중요
        // 배열이름.forEach((value, index, arr) => {.....})
        // => () => {....} 콜백 함수라 부른다.
        // call : 함수를 실행(호출)하라
        // back : 나중에, 또는 제어권을 넘겨 받은
        // 직접 함수()형태로 실행되는게 아니라, 제어권을 넘겨받은 다른 함수가
        // 나중에 호출되도록 만드는 것

        const t_array = [10, 20, 30];
        t_array.forEach((value,index,arr) => {
            console.log(`t_array의 value : ${value}`);
            console.log(`t_array의 index : ${index}`);
            console.log(`t_array의 arr : ${arr}`);
        });

        //map() : 배열을 순회하여 출력하는 메소드
        //          단, 새로운 배열로 반환된다.
        //          반드시 return값 이용하여 값을 반환하여야 한다.
        //map()도 콜백함수 형식이다.
        let t_array02=[1,2,3];
        let doubled = t_array02.map((value, index ,arr) => {
            console.log(`t_array02 출력 : ${value}`);
            return value*10;
        });
        console.log(`t_arry02의 반환된 value : ${doubled}`);

        
    </script>
    
</body>
</html>
