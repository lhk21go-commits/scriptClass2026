<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스크립트 데이터 타입</title>
</head>
<body>
    <!-- <script></script> 사이에 스크립트 코드작성한다.
        <head></head> 또는 <body><?body> 두 영역 중 하나에 입력한다.
        -->
    <script>
        // script 사이에 스크립트 코드 작성한다.
        //head 또는 body 영역 중 하나에 입력한다.
        //ES6 버전 부터는 var 거의 사용하지 않는다.
        //자바스크립트는 데이터 타입이 존재한다. 다만 선언하지 않는다.
        //자바스크립트는 동적인 기능을 작성할 수 있다.
        // var title='book';
        // console.log(title);

        // var title='movie';
        // console.log;

        // title='mosic'
        // console.log(title);

        // //let : 재선언은 안 되고, 재할당만 가능하다.
        // // let title='book02';
        // console.log(title_01);
        
        // title_01='html';
        // console.log(title_01);

        // //const : 재선언 불가, 재할당 불가
        // const title_02='java';  // title_02의 데이터 타입은 문자열(String)
        // console.log(title_02);


        // title_02='python';
        
        let x=5, y=7;   // 현재 x, y 데이터 타입 정수(int)
        console.log(typeof x);  //변수 데이터 타입 확인 가능 명령어
        //삼항연산자 : 조건식 ? 참이면(true) : 거짓(false)
        let big = x > y ? x : y;
        console.log(big);


        // 자바스크립트는 null도 값이다.
        let user = null;    //user 변수는 현재 비어있다.
        // let user01 = NULL;  //NULL은 뭔지 몰라 오류 출력됨
        let Null = '안녕';  //Null은 여기서 변수 이름이다.

        let a = 1;
        let b ='k';
        console.log(a+b);   //1k, String데이터는 나열 됨
        console.log(a*b);   //NaN(Not a Number) 숫자가 아니어서 곱셈 안됨
        console.log('as는 '+a+' b는 '+b+'이다.');
        // 자바스크립트에서 변수와 문자를 자연스럽게 출력하는 기호
        // `(백틱)을 사용한다.
        // 'a는 ${변수}이고, b는 $(b)이다.`
        console.log(`a는 ${a}이고, b는 ${b}이다.`);

    </script>    
</body>
</html>
