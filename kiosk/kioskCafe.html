    4. 메뉴 삭제시 삭제여부 확인하는 confirm() 메소드 사용
     => confirm('삭제 하겠습니까?')가 출력되면
      => 메세지에 [확인][취소] 버튼 2개가 출력되고 
        [확인]버튼 클릭시 true가 반환되고

    -->

             let cart =[]; // cart.push()

             let list = document.getElementById('list');

                return item.category
             })

             console.log()

             let result01 = '';  //메뉴화면 표시
             function display(){

                 let count = 0;
                 for(let i=0; i<7; i++){
                     result01 += `<ul>`;

                        }
                        left_down.innerHTML = result01;

                    };
                    
                    display();
            
                function chooseMenu(cateNum){
                    let filterMenu = menus.filter((item) =>{
                        return item.category === cateNum;
                    })

                    display(cateNum);
                }
                    
                    // 자바 check = -1; => 주문내역에 상품이 존재하는지 유무를 판단
                    function choose(id){
                        console.log(id);
                        //동일 아이템 확인
                        let check = -1;
                        for(let i=0; i<cart.length; i++){
                            if(cart[i].id == menus[id].id){
                                check = i;
                                break;
                            }
                        }
                        
                        //동일 아이템 확인 후 처리
                        if(check !=-1){ //동일 아이템이 있는 경우
                            cart[check].quantity++; //수량만 증가
                            render();
                            getTotal(check);
                        }else{  //동일 아이템이 없는 경우
                            cart.push(menus[id]);    //목록 추가
                            render();
                            getTotal(id);
                        }
                    }
                    
                    // 주문내역 상품 정보 그림그리기 함수
                    function render(){
                        let print ='';
                        for(let i=0; i<cart.length; i++){
                            // let sum = (cart.quantity*cart.price).toLocaleString;    //아이템 가격 합계
                            print += `<div id='item'>${cart[i].name}(${cart[i].type})${cart[i].quantity}개, 
                                ${(cart[i].quantity * cart[i].price).toLocaleString()}원</div>
                                <div id="btn">
                                    <span><button  onclick="minus(${i})">-</button></span>
                                    <span><button  onclick="plus(${i})">+</button></span>
                                    <span><button  onclick="del(${i})">X</button></span>
                                    </div>` 
                                }
                                
                                list.innerHTML = print;
                                // getTotal(i);
                            }
                            // 총 주문금액 함수
                function getTotal(i){
                let total = 0; // 총 주문금액
                            
                for(let i=0; i<cart.length; i++){
                    total += Number((cart[i].quantity * cart[i].price));
                }
                total_display.innerHTML = `총 주문금액 : <span class='total'>${total.toLocaleString()}</span>`;
             }
            // 플러스
            function plus(i){
                cart[i].quantity++;
                getTotal(i);
                render();
            }
            // 마이너스
            function minus(i){
                if(cart[i].quantity<=1){
                    alert('현재 주문수량이 1입니다. 목록을 삭제하시려면 X를 누르세요');
                }else{
                    cart[i].quantity--;
                    getTotal(i);
                    render();
                }
            }
            // 삭제
            function del(i){
                alert(`${cart[i].name}를(을) 목록에서 제거합니다.`);
                cart.splice(i, 1);
                getTotal(i);
                render();
            }
