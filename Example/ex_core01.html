<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코어 기초 연습 문제</title>
        <style>
            button{
                width: 200px;
            }
            button:hover{
                background-color: aquamarine;
                font-weight: bold;
            }
        </style>
</head>
<body>
    <button onclick="showYear()">1.현재년도출력</button><br/>
    <button onclick="showDay()">2.오늘 요일 출력</button><br/>
    <button onclick="showTime()">3.현재 시간 출력</button><br/>
    <button onclick="showDates()">4.하루 후, 일주일 후 날짜 출력</button><br/>
    <button onclick="showWeekend()">5.요일에 따른 메시지 출력</button><br/>
    <p id="output"></p>

    <script>
        let output = document.getElementById('output');
        //1. 현재 연도 출력
        //문제: 현재 날짜를 Date객체로 가져와서 콘솔에 "올해는 2026년입니다." 형식으로 출력하세요
        let today = new Date();
        let presentYear = today.getFullYear();
        function showYear(){
            output.innerHTML = `올해는 ${presentYear}년입니다.`;
        }
        //2. 오늘 요일 출력
        //문제: 현재 날짜를 이용하여 오늘 요일을 한글로 출력하세요.
        // 예: "오늘은 화요일입니다."
        let presentDay = today.getDay()
        let week = ['일','월','화','수','목','금','토'];

        function showDay(){
            output.innerHTML = `오늘은 ${week[presentDay]}요일입니다.`;
        }
        
        // 3. 현재 시간 출력
        // 문제: 현재 시간을 시:분:초 형식으로 출력하세요.
        // 예: "현재 시간: 14:35:20"
        let presentHour = today.getHours();
        let presentMinute = today.getMinutes();
        let presentSecond = today.getSeconds();

        function showTime(){
            output.innerHTML = `현재 시간: ${presentHour}:${presentMinute}:${presentSecond}`;
        }
        
        // 4. 하루 후, 일주일 후 날짜 출력
        // 문제: 오늘 날짜를 기준으로 하루 후와 일주일 후 날짜를 출력하세요.
        // let now = Date.now();
        // let oneDay = 84000000;
        // let oneWeek = 84000000*7;
        // let nextDay = new Date(now + oneDay).toLocaleDateString();
        // let nextWeekDay = new Date(now + oneWeek).toLocaleDateString();
        function showDates(){
            let today02 = new Date();
            //내일
            let tomorrow = new Date(today02);
            tomorrow.setDate(today02.getDate()+1);
            //일주일 후
            let nextWeek = new Date(today02);
            nextWeek.setDate(today02.getDate()+7);

            output.innerHTML = `하루 후 : ${tomorrow.toLocaleDateString()} <br/>  
                                일주일 후 : ${nextWeek.toLocaleDateString()}`;
        }
        
        console.log(nextDay);
        // 5. 요일에 따라 메시지 출력
        // 문제: 오늘 요일이 주말(토, 일)이면 "주말이에요!", 평일이면 "열심히 일하는 날!"을 출력하세요
        function showWeekend(){
            let result = '';
            (presentDay==0 || presentDay==6) ? result = '주말이에요!' : result = '열심히 일하는 날!';
            output.innerHTML = result;
        }



    </script>
</body>
</html>
