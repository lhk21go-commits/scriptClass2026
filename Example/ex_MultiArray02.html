        //다중 forEach 방식
        let arr03 = Array.from(Array(4), () => new Array(4).fill(0));

        arr03.forEach((rowValue) => {   //행
            rowValue.forEach((coValue,index)=>{ //열
                //삼항연산자
                rowValue[index] = index %2 == 0? 1 : 0;

            })
            //콘솔 출력
            console.log(rowValue);
        })

        //다중 map 방식
        const resultArray03 = arr03.map((rowV) =>{
            return rowV.map((coV,ind)=>{
                return ind % 2 == 0? 1 : 0 ;
            })
        })
        console.log(resultArray03);


        //예제 4
        let arr04 = [
            [1,2,3],
            [4,5,6]
        ];      
        let sum = 0;      
        for(let i=0; i<arr04.length; i++){
            for(let j=0; j<arr04[i].length; j++){
                sum += arr04[i][j];
            }
        }
        console.log(`배열의 합계 : ${sum}`);

    </script>
