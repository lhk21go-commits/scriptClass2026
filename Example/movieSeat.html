<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megabox</title>
    <link rel="stylesheet" href="moive.css">
</head>
<body>
    <section class="booking">
        <h1 class="booking__title">빠른예매</h1>
        <div class="booking__wrapper">
            <div class="booking__left">
                <div class="booking__intialize">
                    <p class="booking__subtitle">관람인원선택</p>
                    <button class="btn btn--reset">초기화</button>
                </div>
                <div class="booking__inner-box">
                    <div class="counter-group">
                        <div class="counter-item counter-item-adult">
                            <label for="adult">성인</label>
                            <button onclick="minus()">-</button>
                            <p id="adult">0</p>
                            <button onclick="plus()">+</button>
                        </div>
                        <div class="counter-item counter-item-youth">
                            <label for="adult">청소년</label>
                            <button onclick="minus()">-</button>
                            <p id="youth">0</p>
                            <button onclick="plus()">+</button>
                        </div>
                        <div class="counter-item counter-item-discount">
                            <label for="discount">우대</label>
                            <button onclick="minus()">-</button>
                            <p id="discount">0</p>
                            <button onclick="plus()">+</button>
                        </div>
                    </div>
                    <div class="screen-area">
                        <h3>SCREEN</h3>
                        <div id="screen"></div>
                    </div>
                </div>
            </div>
            <div class="booking__right">
                <div class="movie-wrap">
                    <div class="movie-info">
                        <p class="movie-info__grade">15</p>
                        <p class="movie-info__title">화란</p>
                        <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2D</p>
                    </div>
                    <div class="movie-subwrap">
                        <div class="schedule-info">
                            <p>강남대로(씨티)</p>
                            <p>1관</p>
                            <p>2023.10.16(월)</p>
                            <button id="date">20:50~23:04&nbsp;&nbsp; ^</button>
                        </div>
                        <img src="images/movie.jpg" alt="화란">
                    </div>
                </div>
                <div class="seat-info">
                    <div class="seat-status">
                        <label class="seatStatus"><p class="smallbox"></p>선택</label>
                        <label class="seatStatus"><p class="smallbox"></p>예매완료</label>
                        <label class="seatStatus"><p class="smallbox"></p>일반</label>
                        <label class="seatStatus"><p class="smallbox"></p>장애인</label>
                    </div>
                    <div class="seat-select">
                        <p>선택좌석</p>
                        <div class="chkSeat">
                            <div class="seatNum">-</div>
                            <div class="seatNum">-</div>
                            <div class="seatNum">-</div>
                            <div class="seatNum">-</div>
                            <div class="seatNum">-</div>
                            <div class="seatNum">-</div>
                            <div class="seatNum">-</div>
                            <div class="seatNum">-</div>
                        </div>
                    </div>
                </div>    
                <div class="payment-info">
                    <span>성인</span>
                    <p>최종결제금액</p>
                    <span class="price">10,000 </span><span>원</span>
                </div>
                <div class="booking__navigation">
                    <button class="btn btn--before">이전</button>
                    <button class="btn btn--next">다음</button>
                </div>
            </div>
        </div>

    </section>
    
</body>
</html>
