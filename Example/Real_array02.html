<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .shortage{
            color: red;
        }

    </style>
</head>
<body>
    <h1>책 재고 현황</h1>
    <button onclick="chkStock()">재고 확인</button>
    <div id="output">

    </div>
    
    <script>
        
        // let bookTitle = document.getElementById('book');
        // let bookStock = document.getElementById('stock');
        let output = document.getElementById('output');
        
        function chkStock(){
            let book = ['자바스크립트 입문','HTML & CSS','파이썬 기초','데이터 분석'];
            let stock = [10, 3, 7, 2];
            let result = '';
            for(let i=0; i<book.length; i++){
                let className = (stock[i]<=5)?'shortage':'enough';
                let status = (stock[i]<=5)?'재고 부족':'재고 충분';
                result += `${book[i]} : ${stock[i]}권 - 
                            <span class='${className}'>${status}</span><br/>`;
            }
            output.innerHTML = result;
        }

    </script>
</body>
</html>
