<!DOCTYPE html>

<body>

    <script>
        //예제 5
        let arr05 = [
            [1,2,3],
            [4,5,6]
        ];
        let rowSum01 = 0;
        let rowSum02 = 0;
        for(let i=0; i<arr05.length; i++){
            for(let j=0; j<arr05[i].length; j++){
                if(i==0){
                    rowSum01 += arr05[i][j]; 
                }else{
                    rowSum02 += arr05[i][j]; 
                }
            }
        }
        console.log(`배열의 행의 합계 : ${rowSum01}`);
        console.log(`배열의 행의 합계 : ${rowSum02}`);

        //예제 6
        let arr06 = [
            [3,9,2],
            [8,7,6],
            [1,4,5]
        ];
        let max = 0;
        for(let i=0; i<arr06.length; i++){
            for(let j=0; j<arr06[i].length; j++){
                if(arr06[i][j]>max){
                    max = arr06[i][j];
                }
            }
        }
        console.log(`최대값 : ${max}`)

        let arr = Array.from(Array(5), () => new Array(5).fill(0));
        console.log(arr);
        let count = 1;
        for(let i=0; i<arr.length; i++){
            for(let j=0; j<arr[i].length; j++){
                arr[i][j] = count;
                count++;
            }
        }
        console.log(arr);


    </script>
