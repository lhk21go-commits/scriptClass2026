<!DOCTYPE html>
<html lang="ko`">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slide menu</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            position: relative;
        }
        h1{
            width: 500px;
            margin: 10px auto;
        }
        #menuBtn{
            position: absolute;
            top: 15px;
            left: 10px;
            width: 30px;
            height: 35px;
            font-size: 15px;
            background-color: #464444;
            color: white;
            border: 2px solid black;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10;
        }
        #menuBtn:hover{
            border: 2px solid red;
        }
        #menu{
            position: fixed;
            top: 0;
            left: 0;
            width: 150px;
            height: 300px;
            padding-top: 100px;
            background-color: rgb(128, 123, 123);
            border-radius: 5px;
            transition:  0.5s;
        }
        
        #menu ul li a{
            text-decoration: none;
            color: whitesmoke;
            line-height: 2rem;
            padding-left: 20px;
            padding-top: 100px;
            
        }
        #menu.show{
            left: -200px;
        }
    </style>
</head>
<body>
    <h1>DOM 실습 - 왼쪽 슬라이드 메뉴</h1>
    <button id="menuBtn">&#x2630;</button>
    <nav id="menu">
        <ul>
            <li><a href="#">홈</a></li>
            <li><a href="#">서비스</a></li>
            <li><a href="#">문의</a></li>
            <li><a href="#">연락처</a></li>
            <li><a href="#">소개</a></li>
        </ul>
    </nav>

    <script>
        let menuBtn = document.getElementById('menuBtn');
        let menu = document.getElementById('menu');
       
        menuBtn.addEventListener('click', ()=>{
            menu.classList.toggle('show');

        })
    </script>


</body>
</html>
