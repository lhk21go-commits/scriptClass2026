<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGABOX</title>
  <link rel="stylesheet" href="megabox_01.css">
</head>
<body>
    <section class="container">
        <div class="title">
            <h2>빠른예매</h2>
        </div>
        <div class="wrapLeft">
            <div class="intialize">
                <span>관람인원선택</span>
                <button onclick="initialize()">↻초기화</button>
            </div>
            <div class="seatDisplay">
                <div class="seatCount">
                    <div class="adult">
                        <span>성인</span>
                        <button onclick="changeCount('adult', -1)">-</button>
                        <p id="num-adult">0</p>
                        <button onclick="changeCount('adult', 1)">+</button>
                    </div>
                    <div class="youth">
                        <span>청소년</span>
                        <button onclick="changeCount('youth', -1)">-</button>
                        <p id="num-youth">0</p>
                        <button onclick="changeCount('youth', 1)">+</button>
                    </div>
                    <div class="special">
                        <span>우대</span>
                        <button onclick="changeCount('special', -1)">-</button>
                        <p id="num-special">0</p>
                        <button onclick="changeCount('special', 1)">+</button>
                    </div>
                </div>
                <div class="seats">
                    <p>SCREEN</p>
                    <div id="seatStatus"></div>
                </div>
            </div>
        </div>
        <div class="wrapRight">
            <div class="top-info">
                <span class="age">15</span>
                <span class="movieTitle">화란</span><br>
                <span class="theaterGrade">2D</span>
            </div>
            <div class="second-info">
                <div class="movie-info">
                    <span class="theaterName">강남대로(씨티)</span>
                    <span class="theaterNum">1관</span>
                    <span class="date">2023.10.16(월)</span>
                    <select name="times" id="movieTime">
                        <option value="" selected>20:50~23:04</option>
                    </select>
                </div>
                <img src="images/movie01.jpg" alt="화란 포스트">
            </div>
            <div class="third-info">
                <div class="seatIndex">
                    <label><span>▢</span>선택</label>
                    <label><span>▢</span>예매완료</label>
                    <label><span>▢</span>선택불가</label>
                    <label><span>▢</span>일반</label>
                    <label><span>▢</span>장애인</label>
                </div>
                <div class="selectedSeats">
                    <p>선택좌석</p>
                    <div class="seatNumber">
                        <div id="seatNo"></div>
                    </div>
                </div>
            </div>
            <div class="forth-info">
                <span id="peopleSummary">인원을 선택하세요</span>
                <div class="totalPrice">
                    <span>최종결제금액</span>
                    <p id="price">0</p>
                    <span>원</span>
                </div>
            </div>
            <div class="bottom-btn">
                <button class="before" onclick="goBefore()">이전</button>
                <button class="next" onclick="goNext()">다음</button>
            </div>
        </div>
    </section>

<script>
/* ===== 기본 설정 ===== */
const ROWS = ['A','B','C','D','E','F','G','H','I','J'];   // 10행
const COLS = 10;                                           // 10열 → 총 100석
const MAX_PEOPLE = 8;                                      // 최대 인원(선택좌석 칸 8개)
const PRICE = { adult: 10000, youth: 7000, special: 5000 };
const LABEL = { adult: '성인', youth: '청소년', special: '우대' };

/* 특수 좌석 (예매완료 / 선택불가 / 장애인석) */
const SOLD    = ['A3','A4','C7','D5','D6','F2','F3','H8','I9','I10'];
const BLOCKED = ['E1','E10'];
const HANDI   = ['J1','J2'];

/* ===== 상태 ===== */
const count = { adult: 0, youth: 0, special: 0 };
let selected = [];       // 선택한 좌석 이름 ["A1", "A2" ...]
let seatMap = [];        // 2차원 배열 : 'normal' | 'sold' | 'blocked' | 'handi'

/* ===== 2차원 배열 생성 ===== */
function makeSeatMap() {
    seatMap = [];
    for (let r = 0; r < ROWS.length; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
            const name = ROWS[r] + (c + 1);
            let type = 'normal';
            if (SOLD.includes(name)) type = 'sold';
            else if (BLOCKED.includes(name)) type = 'blocked';
            else if (HANDI.includes(name)) type = 'handi';
            row.push(type);
        }
        seatMap.push(row);
    }
}

/* ===== <table>로 좌석 그리기 ===== */
function drawSeats() {
    let html = '<table>';
    for (let r = 0; r < ROWS.length; r++) {
        html += '<tr><th>' + ROWS[r] + '</th>';
        for (let c = 0; c < COLS; c++) {
            const name = ROWS[r] + (c + 1);
            let cls = 'seat';
            let text = c + 1;
            const type = seatMap[r][c];
            if (type !== 'normal') cls += ' ' + type;
            if (selected.includes(name)) cls += ' selected';
            if (type === 'sold') text = '×';
            html += '<td class="' + cls + '" data-r="' + r + '" data-c="' + c + '">' + text + '</td>';
        }
        html += '</tr>';
    }
    html += '</table>';
    document.getElementById('seatStatus').innerHTML = html;
}

/* ===== 좌석 클릭 (이벤트 위임) ===== */
document.getElementById('seatStatus').addEventListener('click', function (e) {
    const td = e.target.closest('td.seat');
    if (!td) return;

    const r = Number(td.dataset.r);
    const c = Number(td.dataset.c);
    const type = seatMap[r][c];
    const name = ROWS[r] + (c + 1);
    const total = totalPeople();

    if (type === 'sold')    { alert('이미 예매된 좌석입니다.'); return; }
    if (type === 'blocked') { alert('선택할 수 없는 좌석입니다.'); return; }
    if (total === 0)        { alert('관람인원을 먼저 선택해 주세요.'); return; }

    const idx = selected.indexOf(name);
    if (idx >= 0) {
        selected.splice(idx, 1);                 // 선택 해제
    } else {
        if (selected.length >= total) {
            alert('선택한 인원(' + total + '명)만큼만 좌석을 선택할 수 있습니다.');
            return;
        }
        selected.push(name);                     // 선택
    }
    update();
});

/* ===== 인원 증감 ===== */
function totalPeople() {
    return count.adult + count.youth + count.special;
}

function changeCount(type, diff) {
    const next = count[type] + diff;
    if (next < 0) return;
    if (diff > 0 && totalPeople() >= MAX_PEOPLE) {
        alert('최대 ' + MAX_PEOPLE + '명까지 선택할 수 있습니다.');
        return;
    }
    count[type] = next;

    // 인원이 줄어 선택 좌석이 더 많아지면 뒤에서부터 해제
    while (selected.length > totalPeople()) selected.pop();
    update();
}

/* ===== 초기화 ===== */
function initialize() {
    count.adult = count.youth = count.special = 0;
    selected = [];
    update();
}

/* ===== 화면 갱신 ===== */
function update() {
    // 인원 숫자
    for (const t in count) document.getElementById('num-' + t).textContent = count[t];

    // 좌석 다시 그리기
    drawSeats();

    // 선택좌석 표시 (8칸)
    let slots = '';
    for (let i = 0; i < MAX_PEOPLE; i++) {
        if (selected[i]) slots += '<div class="slot on">' + selected[i] + '</div>';
        else slots += '<div class="slot">-</div>';
    }
    document.getElementById('seatNo').innerHTML = slots;

    // 인원 요약 + 금액
    const parts = [];
    let sum = 0;
    for (const t in count) {
        if (count[t] > 0) parts.push(LABEL[t] + ' ' + count[t]);
        sum += count[t] * PRICE[t];
    }
    document.getElementById('peopleSummary').textContent = parts.length ? parts.join(', ') : '인원을 선택하세요';
    document.getElementById('price').textContent = sum.toLocaleString();

    // 다음 버튼 활성화 표시
    const ready = totalPeople() > 0 && selected.length === totalPeople();
    const nextBtn = document.querySelector('.next');
    nextBtn.style.backgroundColor = ready ? '#7844a9' : '';
    nextBtn.style.color = ready ? '#fff' : '';
}

/* ===== 이전 / 다음 ===== */
function goBefore() {
    if (confirm('선택한 내용을 모두 초기화하고 이전 단계로 돌아갈까요?')) initialize();
}

function goNext() {
    const total = totalPeople();
    if (total === 0) { alert('관람인원을 선택해 주세요.'); return; }
    if (selected.length !== total) {
        alert('좌석을 ' + total + '개 선택해 주세요. (현재 ' + selected.length + '개)');
        return;
    }
    alert('좌석: ' + selected.join(', ') + '\n결제금액: ' +
          document.getElementById('price').textContent + '원');
}

/* ===== 시작 ===== */
makeSeatMap();
update();
</script>
</body>
</html>
